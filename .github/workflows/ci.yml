name: FinanSys CI

on:
  push:
    branches:
      - main
      - develop
      - build
      - copilot_mod_v1
      - 'codex/**'
  pull_request:
    branches:
      - main
      - develop
      - build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run PHP tests
        run: php artisan test --compact

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vite manifest assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const manifest = JSON.parse(fs.readFileSync('public/build/manifest.json', 'utf8'));
          const missing = new Set();

          for (const entry of Object.values(manifest)) {
            for (const relativePath of [entry.file, ...(entry.css ?? []), ...(entry.assets ?? [])]) {
              if (relativePath && !fs.existsSync(`public/build/${relativePath}`)) {
                missing.add(relativePath);
              }
            }
          }

          if (missing.size > 0) {
            throw new Error(`Vite manifest references missing files:\n${[...missing].join('\n')}`);
          }
          NODE

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: finansys-public-build
          path: public/build
          if-no-files-found: error
          retention-days: 7

  mysql-financial-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: finansys_test
          MYSQL_USER: finansys
          MYSQL_PASSWORD: finansys_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: finansys_test
      DB_USERNAME: finansys
      DB_PASSWORD: finansys_test_password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Run financial regressions against MySQL
        run: >-
          php artisan test --compact
          tests/Feature/OfxImportTest.php
          tests/Feature/OfxPixCreditReplayTest.php
          tests/Feature/OfxPixReviewPropsTest.php
          tests/Feature/OfxPixPairReviewInvariantTest.php
          tests/Feature/CardPurchaseAndPaymentTest.php
          tests/Feature/CardAdvanceTest.php
          tests/Feature/CardPurchaseReversalTest.php
          tests/Feature/CorrectManualLedgerEntryTest.php
          tests/Feature/MonthlyReceiptForecastResidualQueryTest.php
