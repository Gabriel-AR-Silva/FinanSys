name: FinanSys CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
      - name: Run PHP tests
        run: php artisan test
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Verify Vite manifest assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('public/build/manifest.json', 'utf8'));
          const missing = new Set();
          for (const entry of Object.values(manifest)) {
            for (const relativePath of [entry.file, ...(entry.css ?? []), ...(entry.assets ?? [])]) {
              if (relativePath && !fs.existsSync(`public/build/${relativePath}`)) missing.add(relativePath);
            }
          }
          if (missing.size) throw new Error(`Vite manifest references missing files:\n${[...missing].join('\n')}`);
          NODE
