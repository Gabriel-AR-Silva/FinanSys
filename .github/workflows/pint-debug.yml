name: Pint debug
on:
  push:
    branches:
      - feat/v2-consolidated-financial-contract
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - run: composer install --no-interaction --prefer-dist
      - run: |
          vendor/bin/pint app/Queries/FinancialOverviewQuery.php app/Queries/FinancialPlanningOverviewQuery.php
          git diff -- app/Queries/FinancialOverviewQuery.php app/Queries/FinancialPlanningOverviewQuery.php
