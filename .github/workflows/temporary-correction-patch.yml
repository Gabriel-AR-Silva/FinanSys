name: Temporary correction UI patch
on:
  push:
    branches:
      - feat/manual-entry-safe-corrections
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply safe correction UI patches on feature branch only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              file = Path(path)
              original = file.read_text()
              count = original.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one snippet, found {count}')
              file.write_text(original.replace(old, new))
          index = 'resources/js/Pages/LedgerEntries/Index.vue'
          replace(index, 'Plus, ReceiptText, RotateCcw, Trash2, X', 'Plus, Pencil, ReceiptText, RotateCcw, Trash2, X')
          replace(index, '<div class="flex justify-end gap-1"><button v-if="entry.can_refund"', '<div class="flex justify-end gap-1"><Link v-if="entry.can_correct" :href="route(\'ledger-entries.correction.edit\', entry.id)" class="rounded-lg p-2 text-slate-400 hover:bg-sky-50 hover:text-sky-700" :aria-label="`Corrigir ${entryTitle(entry)}`"><Pencil :size="17" /></Link><button v-if="entry.can_refund"')
          replace(index, '<div class="flex shrink-0 gap-1"><button v-if="entry.can_refund"', '<div class="flex shrink-0 gap-1"><Link v-if="entry.can_correct" :href="route(\'ledger-entries.correction.edit\', entry.id)" class="rounded-lg p-1.5 text-slate-400 hover:bg-sky-50 hover:text-sky-700" :aria-label="`Corrigir ${entryTitle(entry)}`"><Pencil :size="17" /></Link><button v-if="entry.can_refund"')
          query = 'app/Queries/LedgerEntryIndexQuery.php'
          replace(query, 'use App\\Models\\Account;\n', 'use App\\Models\\Account;\nuse App\\Models\\OfxImportItem;\n')
          replace(query, "            'can_delete' => $entry->reversal_of_operation_id === null", "            'can_correct' => $entry->reference_type === (new Account)->getMorphClass()\n                && in_array($entry->type, [LedgerEntryType::Income, LedgerEntryType::Expense], true)\n                && $entry->reversal_of_operation_id === null\n                && ! ($reversedOperationIds?->has($entry->operation_id) ?? false)\n                && ! $entry->receiptForecastLink()->exists()\n                && $entry->expenseRefunds->isEmpty()\n                && ! OfxImportItem::query()->where('domain_type', $entry->getMorphClass())->where('domain_id', $entry->id)->exists(),\n            'can_delete' => $entry->reversal_of_operation_id === null")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/js/Pages/LedgerEntries/Index.vue app/Queries/LedgerEntryIndexQuery.php
          git diff --cached --check
          git commit -m 'feat(ledger): show safe correction links in desktop and mobile history'
          git push origin HEAD:feat/manual-entry-safe-corrections
